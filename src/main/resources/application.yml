server:
  port: 8080

spring:
  application:
    name: resilient-fulfillment-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:fulfillmentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

# Resilience4j Configuration (Circuit Breaker & Bulkhead Patterns)
resilience4j:
  circuitbreaker:
    instances:
      inventoryServiceCB:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2000ms
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  bulkhead:
    instances:
      inventoryServiceBH:
        maxConcurrentCalls: 5
        maxWaitDuration: 100ms

# Observability & Monitoring Config (Actuator & Micrometer Tracing)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
    baggage:
      correlation:
        enabled: true
       
# Splunk HEC Properties
splunk:
  hec:
    url: ${SPLUNK_HEC_URL:http://localhost:8088/services/collector/event}
    token: ${SPLUNK_HEC_TOKEN:REDACTED_REMOVE_AND_ROTATE}

logging:
  level:
    com.fulfillment.service: DEBUG
    io.github.resilience4j: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [app=${spring.application.name} traceId=%X{traceId:-N/A} spanId=%X{spanId:-N/A}] %msg%n"